name: tomo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tomo}
      POSTGRES_USER: ${POSTGRES_USER:-tomo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tomo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tomo} -d ${POSTGRES_DB:-tomo}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
